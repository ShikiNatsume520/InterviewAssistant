[project]
name = "agent"
version = "0.0.1"
description = "Starter template for making a new agent LangGraph."
authors = [
    { name = "William Fu-Hinthorn", email = "13333726+hinthornw@users.noreply.github.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0.0",
    "python-dotenv>=1.0.1",
    "chromadb>=1.0.0",
    "sentence-transformers>=4.0.0",
    "langchain-openai>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sse-starlette>=2.1.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
]


[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kernel", "agents", "server"]
[tool.setuptools.package-dir]
"" = "src"
"kernel" = "src/kernel"
"agents" = "src/agents"
"server" = "src/server"


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
extend-exclude = ["prototypes"]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
    # 中文 docstring 用中文句号「。」结尾，D415 只认英文标点，与之冲突，忽略。
    "D415",
    # docstring 中含反斜杠（如说明 ``\n``）需 r-string，不影响运行，忽略。
    "D301",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
"prototypes/*" = ["D", "T201", "UP"]
"src/cli.py" = ["T201"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.14",
    "mypy>=1.13.0",
    "pytest>=9.0.3",
    "ruff>=0.8.2",
]
