<!doctype html>
<meta charset="utf-8" />
<title>固定侧栏滚动边界探针</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  .app-shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); height: 100dvh; overflow: hidden; }
  .sidebar { min-height: 0; overflow: hidden; background: #172035; color: white; padding: 16px; }
  .chat-panel { min-width: 0; min-height: 0; overflow: hidden; display: grid; grid-template-rows: 64px minmax(0, 1fr) auto; }
  .timeline { min-height: 0; overflow-y: auto; padding: 24px; }
  header, footer { padding: 20px; background: white; }
</style>
<div class="app-shell">
  <aside class="sidebar">固定侧栏</aside>
  <main class="chat-panel">
    <header>固定聊天标题</header>
    <section class="timeline">
      <script>for (let i = 1; i <= 80; i++) document.write(`<p>聊天消息 ${i}</p>`)</script>
    </section>
    <footer>固定输入区</footer>
  </main>
</div>
