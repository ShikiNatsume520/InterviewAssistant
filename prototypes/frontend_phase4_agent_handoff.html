<!doctype html>
<meta charset="utf-8" />
<title>阶段 4 Agent 交接原型</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f7fb; color: #243047; font: 14px system-ui, sans-serif; }
  main { width: 760px; min-height: 100vh; margin: auto; padding: 32px; background: #fafbfd; }
  .message { display: grid; grid-template-columns: 38px 1fr; gap: 10px; margin: 22px 0; }
  .avatar { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; background: #5269da; color: white; }
  .resume .avatar { background: #168973; }
  .name, .receiver { color: #738097; font-size: 12px; }
  .bubble { width: fit-content; max-width: 620px; margin-top: 5px; padding: 12px 15px; border: 1px solid #dfe5ed; border-radius: 5px 14px 14px; background: white; line-height: 1.6; }
  .transition { display: flex; align-items: center; gap: 12px; margin: 30px 0; color: #728097; font-size: 12px; }
  .transition::before, .transition::after { content: ""; height: 1px; flex: 1; background: #dce3ed; }
  .handoff { margin: -18px 48px 22px; padding: 12px; border-radius: 10px; background: #eef8f5; color: #397465; font-size: 12px; }
  .composer { position: sticky; bottom: 16px; margin-top: 40px; padding: 11px; border: 1px solid #cfd8e5; border-radius: 14px; background: white; box-shadow: 0 10px 35px #24304718; }
  textarea { width: 100%; border: 0; outline: 0; resize: none; }
</style>
<main>
  <section class="message">
    <div class="avatar">M</div>
    <div><div class="name">Main Agent</div><div class="bubble">我会把你刚才提到的目标岗位、表达约束和项目经历一起交给简历优化助手。</div></div>
  </section>
  <div class="transition">已进入简历编辑模式 · Main Agent → Resume Agent</div>
  <div class="handoff">正在修改：Agent 后端岗位简历<br>已接收任务简报：目标岗位为后端 Agent 工程师；突出多智能体项目；避免夸张表达。</div>
  <section class="message resume">
    <div class="avatar">R</div>
    <div><div class="name">Resume Agent</div><div class="bubble">我已读取“Agent 后端岗位简历”，并了解你的目标岗位和表达约束。接下来会先优化项目经历。</div></div>
  </section>
  <div class="composer">
    <div class="receiver">发送给 Resume Agent · 当前处于简历编辑模式</div>
    <textarea rows="2" placeholder="输入新的简历修改要求……"></textarea>
  </div>
</main>
